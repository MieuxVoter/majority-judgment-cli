name: Go Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Check the build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-go@v5
      with:
        go-version: "1.25"

#    - name: Go Get Govvv
#      run: go get github.com/ahmetb/govvv

    - name: Go Get
      run: go get

    - name: Tests
      run: make test

    - name: Build for Linux (amd64)
      run: make build

    - name: Test Build
      run: ./mj example/example.csv --sort
